name: Deploy VitePress to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine base path
        id: base
        shell: bash
        run: |
          OWNER_REPO="${{ github.repository }}" # e.g. user/repo
          REPO_NAME="${OWNER_REPO#*/}"
          if [ "${{ github.repository_owner }}" = "${REPO_NAME%.github.io}" ] && [[ "${REPO_NAME}" == *.github.io ]]; then
            # user/org pages root domain
            echo "base=/" >> $GITHUB_OUTPUT
          else
            echo "base=/${REPO_NAME}/" >> $GITHUB_OUTPUT
          fi

      - name: Build site
        env:
          DEPLOY_BASE: "${{ steps.base.outputs.base }}"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4