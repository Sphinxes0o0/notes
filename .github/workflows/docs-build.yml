name: Build Documentation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Check link checker regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check search rendering regressions
        run: node --test .github/scripts/test-*.mjs
      - name: Check navigation
        run: npm run check:navigation
      - name: Check internal links
        run: npm run check:links
      - name: Check document metadata
        run: npm run check:frontmatter
      - name: Check reviewed content candidates
        run: npm run audit:content
      - name: Check duplicate assets
        run: npm run check:assets
      - name: Build site
        run: npm run docs:build
      - name: Check generated search index
        run: npm run check:search
      - name: Check published pages, assets and link destinations
        run: |
          npm run docs:preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/notes-preview.log 2>&1 &
          notes_preview_pid=$!
          trap 'kill "$notes_preview_pid" 2>/dev/null || true' EXIT
          python3 scripts/check_built_site.py
