name: Audit Code Blocks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-codeblocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Audit code blocks in markdown files
        run: node .github/scripts/audit-codeblocks.js
