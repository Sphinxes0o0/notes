name: Link Check (Internal)

# Fast check: only internal links. Runs on every push and PR so
# authors see broken internal links immediately.
# External link probing is in a separate weekly workflow to avoid
# slowing every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # for posting PR comment

jobs:
  link-check:
    name: Internal link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run link check
        id: check
        run: |
          status=0
          python3 scripts/link_check.py --json > /tmp/links.json || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::link_check.py failed with exit code $status"
            exit "$status"
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open('/tmp/links.json') as f:
              internal = json.load(f)['internal']
          print(f"broken_internal={internal['broken_count']}")
          PY

      - name: Format PR comment
        if: github.event_name == 'pull_request' && steps.check.outcome == 'success'
        id: fmt
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          with open('/tmp/links.json') as f:
              r = json.load(f)
          broken = r['internal']['broken']
          total = r['internal']['total']
          count = r['internal']['broken_count']
          if count == 0:
              print("## ✅ Link Check (Internal)\n\n")
              print(f"**{total}** internal links validated — all good.\n")
          else:
              print("## ❌ Link Check (Internal) — Broken Links\n\n")
              print(f"Found **{count}** broken internal link(s):\n")
              print("| File | Link |")
              print("|------|------|")
              for it in broken:
                  print(f"| `{it['file']}` | `[{it['link']}]` |")
              if count > len(broken):
                  print(f"\n*…and {count - len(broken)} more.*\n")
              print("\nRun locally:\n```bash\npython3 scripts/link_check.py\n```\n")
          PY

      - name: Post PR comment
        if: github.event_name == 'pull_request' && steps.check.outcome == 'success'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: /tmp/comment.md

      - name: Fail check if broken
        if: always() && steps.check.outcome == 'success' && steps.check.outputs.broken_internal != '0'
        run: |
          echo "::error::Found ${{ steps.check.outputs.broken_internal }} broken internal link(s). See PR comment for details."
          exit 1
