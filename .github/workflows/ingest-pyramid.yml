name: Ingest into Pyramid Wiki

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'CLAUDE.md'

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout notes (source)
        uses: actions/checkout@v4
        with:
          path: notes-src

      - name: Checkout pyramid (wiki)
        uses: actions/checkout@v4
        with:
          repository: Sphinxes0o0/pyramid
          token: ${{ secrets.WIKI_PUSH_TOKEN }}
          path: pyramid

      - name: Sync raw sources
        run: |
          # Notes repo content is at root (ccpp/, kernel/, network/, etc.)
          # Sync everything except .git, node_modules, .github into pyramid's raw/
          rsync -av --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.github' \
            --exclude='.vitepress' --exclude='README.md' --exclude='CLAUDE.md' \
            --exclude='package.json' --exclude='package-lock.json' \
            notes-src/ pyramid/raw/github/notes/

      - name: Ingest (Copilot → MiniMax fallback)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
        run: |
          cd pyramid
          python3 scripts/ingest_wiki.py . github/notes
