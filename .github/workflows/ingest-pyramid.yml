name: Ingest into Pyramid Wiki

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'CLAUDE.md'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes (source)
        uses: actions/checkout@v4
        with:
          path: notes-src

      - name: Checkout pyramid (wiki)
        uses: actions/checkout@v4
        with:
          repository: Sphinxes0o0/pyramid
          token: ${{ secrets.WIKI_PUSH_TOKEN }}
          path: pyramid

      - name: Sync raw sources
        run: |
          rsync -av --delete notes-src/notes/ pyramid/raw/github/notes/ || true
          rsync -av --delete notes-src/courses/ pyramid/raw/github/notes/courses/ || true
          rsync -av --delete notes-src/resources/ pyramid/raw/github/notes/resources/ || true

      - name: Run ingest
        env:
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
        run: |
          cd pyramid
          python3 scripts/ingest_wiki.py . github/notes || true
